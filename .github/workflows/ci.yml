name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install

      - name: Verify Tool Versions
        run: |
          node -v
          yarn -v

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run TypeScript Type Check
        run: yarn typecheck

      - name: Build Packages
        run: yarn build

      - name: Run ESLint
        run: yarn lint

      - name: Run Tests
        run: yarn test
